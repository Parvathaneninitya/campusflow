<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusFlow | Event Management System</title>
    <link rel="icon" href="data:," />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>

  <body>
    <!-- Background Decorations -->
    <div class="bg-circle circle1"></div>
    <div class="bg-circle circle2"></div>
    <div class="bg-circle circle3"></div>

    <main class="login-container">
      <!-- Left Side -->
      <section class="welcome-section">
        <div class="logo-box">
          <i class="fa-solid fa-calendar-check"></i>
        </div>

        <h1>CampusFlow</h1>

        <p class="subtitle">Campus Event Management & Certificate Portal</p>

        <div class="features">
          <div class="feature">
            <i class="fa-solid fa-circle-check"></i>
            Event Registrations
          </div>

          <div class="feature">
            <i class="fa-solid fa-circle-check"></i>
            Attendance Tracking
          </div>

          <div class="feature">
            <i class="fa-solid fa-circle-check"></i>
            Automatic Certificates
          </div>

          <div class="feature">
            <i class="fa-solid fa-circle-check"></i>
            Student Activity Dashboard
          </div>
        </div>
      </section>

      <!-- Right Side -->
      <section class="login-card">
        <h2>Welcome Back</h2>
        <p class="login-text">Login to continue</p>

        <!-- Role Tabs -->

        <div class="role-selector">
          <button class="role-btn active" data-role="student">
            <i class="fa-solid fa-user-graduate"></i>
            Student
          </button>

          <button class="role-btn" data-role="faculty">
            <i class="fa-solid fa-user-tie"></i>
            Faculty
          </button>
        </div>

        <!-- Login Form -->

        <form id="loginForm">
          <div class="input-group">
            <label>Email</label>

            <div class="input-box">
              <i class="fa-solid fa-envelope"></i>

              <input
                type="email"
                id="loginEmail"
                placeholder="Enter Email"
                required
              />
            </div>
          </div>

          <div class="input-group">
            <label>Password</label>

            <div class="input-box">
              <i class="fa-solid fa-lock"></i>

              <input
                type="password"
                id="loginPassword"
                placeholder="Enter Password"
                required
              />

              <button type="button" class="toggle-password">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="login-options">
            <label class="remember">
              <input type="checkbox" />

              Remember Me
            </label>

            <a href="#" id="forgotPassword"> Forgot Password? </a>
          </div>

          <button class="login-btn" type="submit">
            <i class="fa-solid fa-right-to-bracket"></i>

            Login
          </button>
        </form>

        <!-- Register -->

        <div id="studentRegisterSection" class="register-section">
          <p>Don't have a Student account?</p>

          <button id="openRegisterModal" class="register-btn">
            Register Now
          </button>
        </div>
      </section>
    </main>

    <!-- =======================
        STUDENT REGISTER MODAL
    =========================-->

    <div class="modal" id="registerModal">
      <div class="modal-content">
        <button class="close-modal" id="closeModal">
          <i class="fa-solid fa-xmark"></i>
        </button>

        <h2>Create Student Account</h2>

        <form id="studentRegisterForm">
          <!-- Name -->

          <div class="input-group">
            <label>Full Name</label>

            <div class="input-box">
              <i class="fa-solid fa-user"></i>

              <input
                type="text"
                id="studentName"
                placeholder="Enter Full Name"
                required
              />
            </div>
          </div>

          <!-- Register Number -->

          <div class="input-group">
            <label>Register Number</label>

            <div class="input-box">
              <i class="fa-solid fa-id-card"></i>

              <input
                type="text"
                id="registerNumber"
                placeholder="Ex: 23B01A0501"
                required
              />
            </div>
          </div>

          <!-- Email -->

          <div class="input-group">
            <label>College Email</label>

            <div class="input-box">
              <i class="fa-solid fa-envelope"></i>

              <input type="email" id="studentEmail" readonly />
            </div>
          </div>

          <!-- Department -->

          <div class="input-group">
            <label>Department</label>

            <select id="department" required>
              <option value="">Select Department</option>

              <option>CSE</option>
              <option>AI & DS</option>
              <option>AI & ML</option>
              <option>IT</option>
              <option>ECE</option>
              <option>EEE</option>
              <option>CIVIL</option>
              <option>MECHANICAL</option>
            </select>
          </div>

          <!-- Year -->

          <div class="input-group">
            <label>Year</label>

            <select id="year" required>
              <option value="">Select Year</option>

              <option>1st Year</option>
              <option>2nd Year</option>
              <option>3rd Year</option>
              <option>4th Year</option>
            </select>
          </div>

          <!-- Password -->

          <div class="input-group">
            <label>Password</label>

            <div class="input-box">
              <i class="fa-solid fa-lock"></i>

              <input
                type="password"
                id="registerPassword"
                placeholder="Minimum 8 characters"
                required
              />
            </div>
          </div>

          <!-- Confirm -->

          <div class="input-group">
            <label>Confirm Password</label>

            <div class="input-box">
              <i class="fa-solid fa-lock"></i>

              <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter Password"
                required
              />
            </div>
          </div>

          <button class="register-submit" type="submit">
            <i class="fa-solid fa-user-plus"></i>

            Create Account
          </button>
        </form>
      </div>
    </div>

    <!-- Loading Overlay -->

    <div id="loader" class="loader hidden">
      <div class="spinner"></div>

      <p>Please wait...</p>
    </div>

    <!-- Toast Notification -->

    <div id="toast"></div>

    <!-- Scripts -->

    <script type="module" src="js/firebase.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/register.js"></script>
    <script type="module" src="js/ui.js"></script>
  </body>
</html>
