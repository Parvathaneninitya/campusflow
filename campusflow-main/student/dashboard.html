<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal | CampusFlow</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <head>
      <!-- Other meta tags and stylesheets -->

      <!-- Add jsPDF library for client-side certificate generation -->
      <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    </head>
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <div class="brand">
          <i class="fa-solid fa-graduation-cap"></i>
          <span>CampusFlow</span>
        </div>
        <p class="portal-tag">Student Portal</p>

        <nav class="nav-menu">
          <button class="nav-btn active" data-tab="approvedEventsSection">
            <i class="fa-solid fa-calendar-check"></i> Approved Events
          </button>
          <button class="nav-btn" data-tab="myRegistrationsSection">
            <i class="fa-solid fa-list-check"></i> My Registrations
          </button>
          <button class="nav-btn" data-tab="attendanceSection">
            <i class="fa-solid fa-qrcode"></i> Mark Attendance
          </button>
          <button class="nav-btn" data-tab="certificatesSection">
            <i class="fa-solid fa-award"></i> Certificates
          </button>
          <button class="nav-btn" data-tab="notificationsSection">
            <i class="fa-solid fa-bell"></i> Notifications
          </button>
          <button class="nav-btn logout-btn" id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>
        </nav>
      </aside>

      <!-- Main Content Panel -->
      <main class="content-area">
        <!-- Section 1: Approved Events -->
        <section id="approvedEventsSection" class="tab-content active">
          <h2>Approved Events</h2>
          <div id="approvedEventsContainer" class="grid-container">
            <!-- Rendered by events.js -->
          </div>
        </section>

        <!-- Section 2: My Registrations -->
        <section id="myRegistrationsSection" class="tab-content hidden">
          <h2>My Registrations</h2>
          <div id="myRegistrationsContainer" class="grid-container">
            <!-- Rendered by registrations.js -->
          </div>
        </section>

        <!-- Section 3: Live Attendance -->
        <section id="attendanceSection" class="tab-content hidden">
          <h2>Mark Attendance</h2>
          <div class="card-box">
            <p>Enter the attendance session code provided by the faculty:</p>
            <form id="attendanceForm">
              <div class="form-group">
                <label for="attendanceEventSelect">Select Event</label>
                <select id="attendanceEventSelect" class="form-input" required>
                  <option value="">-- Choose Registered Event --</option>
                </select>
              </div>
              <div class="form-group">
                <label for="attendanceCodeInput">Session Code</label>
                <input
                  type="text"
                  id="attendanceCodeInput"
                  class="form-input"
                  maxlength="6"
                  placeholder="Enter code (Ex: 8492)"
                  required
                />
              </div>
              <button type="submit" class="submit-btn">
                <i class="fa-solid fa-check"></i> Submit Attendance
              </button>
            </form>
          </div>
        </section>

        <!-- Section 4: Certificates -->
        <section id="certificatesSection" class="tab-content hidden">
          <h2>My Certificates</h2>
          <div id="certificatesContainer" class="grid-container">
            <!-- Rendered by certificates.js -->
          </div>
        </section>

        <!-- Section 5: Notifications -->
        <section id="notificationsSection" class="tab-content hidden">
          <h2>Notifications & Announcements</h2>
          <div id="notificationsContainer" class="list-container">
            <!-- Rendered by notifications.js -->
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Main Controller Module -->
    <script type="module" src="js/student-dashboard.js"></script>
  </body>
</html>
